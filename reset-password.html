<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>blubook · Password recovery</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px;background:#51406b;color:#362943;font:16px system-ui,sans-serif}body::before{content:'✧   ·   ✦';position:fixed;top:9%;right:12%;font-size:30px;color:#d7c5e9;pointer-events:none}.window{width:min(440px,100%);background:#f0e7f7;border:2px solid #3b2c48;box-shadow:5px 5px 0 #a38cb9}.bar{background:#d9c4e8;padding:10px 14px;border-bottom:2px solid #9f83b7;font:700 14px monospace;letter-spacing:.6px;display:flex;justify-content:space-between}.content{padding:24px;display:grid;gap:14px}h1{font-size:22px;margin:0;text-align:center}p{margin:0;line-height:1.5}.sub{text-align:center;font-size:14px}.art{width:48px;justify-self:center;image-rendering:pixelated}form{display:grid;gap:13px}label{display:grid;gap:6px;font-size:14px}input{font:inherit;width:100%;border:1px solid #9479a6;background:#fffaff;padding:10px;color:#362943;border-radius:0}button{font:600 16px inherit;font-family:inherit;background:#dfcbea;color:#362943;border:1px solid #8e739f;box-shadow:2px 2px 0 #a38cb9;padding:11px;cursor:pointer}button:disabled{opacity:.55;cursor:default}a{color:#503b65;text-align:center;font-size:14px}#notice{background:#e2d2ef;border:1px solid #ac92bd;padding:10px;font-size:14px;overflow-wrap:anywhere}#notice:empty{display:none}[hidden]{display:none!important}:focus-visible{outline:2px solid #644294;outline-offset:3px}.foot{font-size:12px;color:#655570;text-align:center}
</style></head><body><main class="window"><header class="bar"><span>blubook.exe · recovery</span><span aria-hidden="true">□</span></header><section class="content"><svg class="art" viewBox="0 0 24 24" shape-rendering="crispEdges" aria-hidden="true"><path fill="#49365e" d="M2 3h20v16H2zM0 20h24v2H0z"/><path fill="#f6effa" d="M4 5h16v12H4z"/><path fill="#9875bd" d="M7 8h4v2h2V8h4v5h-2v2h-2v2h-2v-2H9v-2H7z"/></svg><h1 id="title">Password recovery</h1><p class="sub" id="subtitle">Request a secure password reset email.</p><p id="notice" role="status" aria-live="polite"></p><form id="request"><label>Email address<input id="email" type="email" autocomplete="email" required></label><button id="send" disabled>Send recovery email</button></form><form id="reset" hidden><label>New password<input id="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirm new password<input id="confirm" type="password" minlength="12" autocomplete="new-password" required></label><button id="save" disabled>Save new password</button></form><button id="retry" hidden>Request a new recovery link</button><a id="back" href="auth-preview.html">Return to blubook</a><p class="foot">Secure password recovery · v4 · direct connection</p></section></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const BASE='https://kwfmglkxuvtzjrqptahx.supabase.co/auth/v1';
const KEY='sb_publishable_dsG8-VTjU1lFnQSuYRFFoQ_eSjVeEMp';
const REDIRECT='https://blusoup.github.io/blubook/reset-password.html';
const hash=new URLSearchParams(location.hash.slice(1)), query=new URLSearchParams(location.search);
let access=hash.get('access_token');
const callback=hash.has('access_token')||hash.has('error')||hash.has('error_code')||query.has('error')||query.has('code')||hash.get('type')==='recovery';
const validCallback=hash.get('type')==='recovery'&&!!access&&!hash.has('error')&&!query.has('error');
if(callback)history.replaceState(null,'',location.pathname);
let verified=false,busy=false;
function note(t){$('notice').textContent=t}
function buttons(){$('send').disabled=busy;$('save').disabled=busy||!verified;$('retry').disabled=busy;}
function requestView(){access=null;verified=false;$('title').textContent='Forgot your password?';$('subtitle').textContent='We can email you a secure recovery link.';$('request').hidden=false;$('reset').hidden=true;$('retry').hidden=true;$('back').hidden=false;buttons()}
function failure(t){access=null;verified=false;$('reset').hidden=true;$('request').hidden=true;$('retry').hidden=false;$('back').hidden=false;note(t);buttons()}
function resetView(){$('title').textContent='Choose a new password.';$('subtitle').textContent='Use at least 12 characters.';$('request').hidden=true;$('reset').hidden=false;$('retry').hidden=true;$('back').hidden=true;buttons()}
async function api(path,method='GET',body,token){
 const headers={apikey:KEY};if(body!==undefined)headers['Content-Type']='application/json';if(token)headers.Authorization='Bearer '+token;
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);
 try{const res=await fetch(BASE+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:controller.signal,cache:'no-store',redirect:'error',credentials:'omit',referrerPolicy:'no-referrer'});const raw=await res.text();let data={};try{data=raw?JSON.parse(raw):{}}catch{}if(!res.ok){const err=new Error(data.msg||data.message||data.error_description||'Request failed ('+res.status+').');err.code=data.error_code||data.code;err.status=res.status;throw err}return data;}finally{clearTimeout(timer)}
}
function errorText(e){if(e.status===429)return 'Email sending limit reached. Please try again later.';if(e.name==='AbortError'||e instanceof TypeError)return 'Could not connect to blubook accounts. Check your internet connection and try again.';return e.message||'Something went wrong.'}
$('retry').onclick=()=>{requestView();note('Request a fresh link. Only use the newest email.')};
$('request').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;buttons();note('Sending recovery request…');try{await api('/recover?redirect_to='+encodeURIComponent(REDIRECT),'POST',{email:$('email').value.trim()});note('If the email is registered, a recovery email will arrive. Check Spam. Use the newest link.')}catch(e){note(errorText(e))}finally{busy=false;buttons()}};
$('reset').onsubmit=async e=>{e.preventDefault();if(!verified||busy||!access)return;const pw=$('password').value;if(pw.length<12||pw!==$('confirm').value){note('Use at least 12 characters and make sure the passwords match.');return}busy=true;buttons();note('Saving your new password…');try{await api('/user','PUT',{password:pw},access);verified=false;$('reset').hidden=true;$('back').hidden=false;$('title').textContent='Password changed.';$('subtitle').textContent='Return to blubook and log in with your new password.';note('Your new password has been saved.');try{await api('/logout?scope=global','POST',undefined,access)}catch{note('Password saved. Session sign-out could not be confirmed; log out of any open blubook tabs.')}access=null}catch(e){if(e.status===401||e.status===403)failure('The recovery session is no longer valid. Request a fresh link.');else note(errorText(e))}finally{$('password').value='';$('confirm').value='';busy=false;buttons()}};
async function init(){if(!callback){requestView();return}if(!validCallback){failure('This recovery link is invalid or expired. Request a new link.');return}resetView();note('Checking your recovery link…');try{const user=await api('/user','GET',undefined,access);if(!user.id)throw new Error('Could not verify your account.');verified=true;note('');buttons()}catch(e){failure('The recovery session could not be verified. '+errorText(e))}}
init();
})();
</script></body></html>
